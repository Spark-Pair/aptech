name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infinityfree-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, ctype, fileinfo, json, openssl, tokenizer, xml
          coverage: none

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Clear build-time Laravel caches
        run: |
          rm -f bootstrap/cache/*.php
          rm -f storage/framework/views/*.php
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to InfinityFree
        env:
          FTP_HOST: ftpupload.net
          FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        run: |
          test -n "$FTP_USERNAME" || (echo "Missing INFINITYFREE_FTP_USERNAME secret" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "Missing INFINITYFREE_FTP_PASSWORD secret" && exit 1)
          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set net:timeout 20;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_HOST;
            mirror -R --delete --verbose \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob tests/ \
              --exclude-glob .env \
              --exclude-glob .env.* \
              --exclude-glob storage/logs/* \
              --exclude-glob storage/framework/cache/data/* \
              --exclude-glob storage/framework/sessions/* \
              --exclude-glob storage/framework/views/* \
              ./ /htdocs/;
            bye
          "
